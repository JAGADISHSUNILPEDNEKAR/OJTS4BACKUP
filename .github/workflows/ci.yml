name: "CI: Lint & Test"

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python-tests:
    name: "pytest: ${{ matrix.service }}"
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service:
          - auth-service
          - user-service
          - shipment-service
          - iot-ingestion-service
          - ml_service
          - alert_service
          - escrow-service
          - audit_reporting_service
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install service deps
        working-directory: services/${{ matrix.service }}
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          # Every service ships requirements.dev.txt for test deps. If a
          # service is missing this file, surface it loudly instead of
          # silently papering over with ad-hoc installs here.
          if [ ! -f requirements.dev.txt ]; then
            echo "::error::services/${{ matrix.service }}/requirements.dev.txt is missing"
            exit 1
          fi
          pip install -r requirements.dev.txt

      - name: Run pytest
        working-directory: services/${{ matrix.service }}
        env:
          PYTHONPATH: .
          # Fail-closed flags default to true (so production refuses to
          # boot with dev secrets). Tests don't have Vault / real keys,
          # so opt out explicitly for the test environment.
          REQUIRE_VAULT_KEYS: "false"
          REQUIRE_INTERNAL_API_KEY: "false"
          REQUIRE_VAULT_DEVICE_SECRETS: "false"
          REQUIRE_SENDGRID_KEY: "false"
        run: |
          # Some services may not have a tests/ dir yet — skip cleanly
          # rather than failing the matrix entry.
          if [ -d tests ] && ls tests/test_*.py >/dev/null 2>&1; then
            python -m pytest tests/ -v --tb=short
          else
            echo "No tests/ directory or test files found — skipping."
          fi

  python-lint:
    name: "ruff: lint Python services"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install ruff
        run: pip install ruff

      - name: Lint
        # Full pyflakes (F) + syntax errors (E9). F catches the bug classes
        # that matter at runtime: undefined names, unused imports/vars,
        # shadowed bindings, broken format strings. We deliberately skip
        # the E/W style rules so the test-file `mock asyncpg before import`
        # pattern (E402) doesn't trip CI.
        run: ruff check --select F,E9 services/

  integration-tests:
    name: "integration: infra smoke (postgres + redis + migrations)"
    runs-on: ubuntu-latest
    services:
      postgres:
        image: timescale/timescaledb:latest-pg16
        env:
          POSTGRES_USER: origin
          POSTGRES_PASSWORD: password
          POSTGRES_DB: origin_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U origin -d origin_db"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 30
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install psql + Python deps
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends postgresql-client
          python -m pip install --upgrade pip
          pip install -r tests/integration/requirements.txt

      - name: Apply migrations
        env:
          DATABASE_URL: postgresql://origin:password@localhost:5432/origin_db
        run: ./infra/db/run_migrations.sh

      - name: Run integration tests
        working-directory: tests/integration
        env:
          INTEGRATION_DATABASE_URL: postgresql://origin:password@localhost:5432/origin_db
          INTEGRATION_REDIS_URL: redis://localhost:6379
        run: pytest -v --tb=short

  e2e-kafka-audit:
    name: "e2e: shipment.created → audit_logs"
    runs-on: ubuntu-latest
    # Heavier than the rest — builds the audit-reporting-service image and
    # boots Kafka. Allow up to 15 min; the unit-test path is unaffected.
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install test deps
        run: |
          python -m pip install --upgrade pip
          pip install -r tests/e2e/requirements.txt

      - name: Boot postgres + kafka + zookeeper + audit-reporting (compose)
        run: |
          # Just the subset we need for the audit pipeline E2E. db-migrate
          # depends on postgres being healthy, then exits; audit-reporting
          # depends on db-migrate completing.
          docker compose up -d --build \
            postgres zookeeper kafka db-migrate audit-reporting-service

          # audit-reporting-service has condition: service_completed_successfully
          # on db-migrate, so `docker compose up -d` above already returned 0
          # only if migrations completed cleanly. We still inspect the exit code
          # explicitly so a future compose-file change can't silently skip this
          # gate — and we avoid `docker compose wait`, which reports "no
          # containers" when the target service has already exited.
          echo "Verifying db-migrate exit code..."
          CID="$(docker compose ps -aq db-migrate)"
          if [ -z "$CID" ]; then
            echo "::error::db-migrate container not found"
            docker compose ps -a
            exit 1
          fi
          EXIT_CODE="$(docker inspect "$CID" --format='{{.State.ExitCode}}')"
          if [ "$EXIT_CODE" != "0" ]; then
            echo "::error::db-migrate exited with code $EXIT_CODE"
            docker compose logs db-migrate
            exit 1
          fi
          echo "db-migrate completed successfully"

          echo "Waiting for audit-reporting-service to be up..."
          for i in {1..60}; do
            if docker compose exec -T audit-reporting-service curl -fs http://localhost:8000/health > /dev/null 2>&1; then
              echo "audit-reporting-service healthy"
              break
            fi
            sleep 2
          done

      - name: Run E2E test
        env:
          # postgres compose port-forward is 5434
          E2E_DATABASE_URL: postgresql://origin:password@localhost:5434/origin_db
          # kafka host-access listener is 29092
          E2E_KAFKA_BOOTSTRAP: localhost:29092
        working-directory: tests/e2e
        run: pytest -v --tb=short

      - name: Dump audit-reporting logs on failure
        if: failure()
        run: |
          echo '== audit-reporting-service ==' && docker compose logs --tail 200 audit-reporting-service || true
          echo '== kafka ==' && docker compose logs --tail 100 kafka || true
          echo '== db-migrate ==' && docker compose logs db-migrate || true

      - name: Tear down
        if: always()
        run: docker compose down -v

  rust-checks:
    name: "rust: crypto-service fmt + clippy + test"
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/crypto-service
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo registry & target
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            services/crypto-service/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('services/crypto-service/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      # rdkafka needs a C build chain + libsasl + cmake to compile the
      # bundled librdkafka. Skip if you switch rdkafka to a dynamic feature
      # later, but for now compile-time deps must be present.
      - name: Install C build deps
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake pkg-config libssl-dev libsasl2-dev zlib1g-dev

      - name: cargo fmt --check
        run: cargo fmt --all -- --check

      - name: cargo clippy
        # -D warnings turns every clippy lint into a hard fail. Start with
        # warnings-as-warnings and tighten in a follow-up once the existing
        # findings are cleared.
        run: cargo clippy --all-targets --all-features

      - name: cargo test
        run: cargo test --all-features

  web-checks:
    name: "web-app: eslint + tsc"
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web-app
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: apps/web-app/package-lock.json

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type-check
        run: npx tsc --noEmit
