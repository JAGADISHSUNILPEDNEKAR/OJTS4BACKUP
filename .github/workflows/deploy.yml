name: "Build & Deploy Microservices"

on:
  push:
    branches:
      - main
    paths:
      - 'services/**'
      - 'infra/db/**'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:

env:
  AWS_REGION: us-east-1

permissions:
  id-token: write
  contents: read

jobs:
  apply-migrations:
    name: Apply DB Migrations
    runs-on: ubuntu-latest
    # Skip cleanly when no DB URL is configured (e.g. forks, first-time setup)
    # rather than blocking every image build. CI will surface the skip in logs.
    if: ${{ github.event_name == 'workflow_dispatch' || github.event_name == 'push' }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install psql client
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends postgresql-client

      - name: Apply SQL migrations
        env:
          # DATABASE_URL must be a libpq URL (postgresql://user:pass@host:port/db)
          # for the staging RDS instance, reachable from GitHub-hosted runners
          # (either public with IP allowlist, or via a self-hosted runner inside
          # the VPC). Configure in repo Settings → Secrets and variables.
          DATABASE_URL: ${{ secrets.STAGING_DATABASE_URL }}
        run: |
          if [ -z "${DATABASE_URL:-}" ]; then
            echo "::warning::STAGING_DATABASE_URL secret is not set; skipping migrations."
            echo "Configure the secret to gate deploys on schema convergence."
            exit 0
          fi
          ./infra/db/run_migrations.sh

  build-and-push:
    name: Build & Push Images to ECR
    needs: apply-migrations
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: 
          - auth-service
          - user-service
          - shipment-service
          - iot-ingestion-service
          - ml_service 
          - alert_service
          - escrow-service
          - audit_reporting_service
          - crypto-service
      fail-fast: false

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::896170900409:role/github-actions-origin-role
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Resolve repo/dir names
        id: names
        run: |
          DIR_NAME=${{ matrix.service }}
          # The directory names have underscores in some places, but the
          # service / ECR repo names use hyphens. Map both ways here.
          case "$DIR_NAME" in
            ml_service)              REPO_NAME="ml-service" ;;
            alert_service)           REPO_NAME="alert-service" ;;
            audit_reporting_service) REPO_NAME="audit-reporting-service" ;;
            *)                       REPO_NAME="$DIR_NAME" ;;
          esac
          echo "dir_name=$DIR_NAME" >> "$GITHUB_OUTPUT"
          echo "repo_name=$REPO_NAME" >> "$GITHUB_OUTPUT"

      - name: Build image locally
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
          DIR_NAME: ${{ steps.names.outputs.dir_name }}
          REPO_NAME: ${{ steps.names.outputs.repo_name }}
        run: |
          echo "Building $DIR_NAME for repo origin-staging-$REPO_NAME"
          docker build -t "$ECR_REGISTRY/origin-staging-$REPO_NAME:$IMAGE_TAG" "./services/$DIR_NAME"

      - name: Scan image with Trivy (HIGH/CRITICAL)
        uses: aquasecurity/trivy-action@0.28.0
        with:
          # Scan the locally-built image before it touches the registry.
          # Anything HIGH or CRITICAL with a known fix fails the deploy —
          # ignore-unfixed: true means we don't block on CVEs upstream
          # hasn't shipped a patch for yet.
          image-ref: ${{ steps.login-ecr.outputs.registry }}/origin-staging-${{ steps.names.outputs.repo_name }}:${{ github.sha }}
          format: table
          exit-code: '1'
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          vuln-type: os,library

      - name: Push image to ECR
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
          REPO_NAME: ${{ steps.names.outputs.repo_name }}
        run: |
          docker push "$ECR_REGISTRY/origin-staging-$REPO_NAME:$IMAGE_TAG"
          docker tag "$ECR_REGISTRY/origin-staging-$REPO_NAME:$IMAGE_TAG" "$ECR_REGISTRY/origin-staging-$REPO_NAME:latest"
          docker push "$ECR_REGISTRY/origin-staging-$REPO_NAME:latest"
