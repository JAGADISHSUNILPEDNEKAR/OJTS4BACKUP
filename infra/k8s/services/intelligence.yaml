# ML Service
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ml-service
  labels:
    app: ml-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ml-service
  template:
    metadata:
      labels:
        app: ml-service
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/path: "/metrics"
        prometheus.io/port: "8000"
    spec:
      # Ensure ML model runs on our specialized Spot instances
      nodeSelector:
        workload: "machine-learning"
      tolerations:
      - key: "dedicated"
        operator: "Equal"
        value: "machine-learning"
        effect: "NoSchedule"
      containers:
      - name: ml-service
        image: origin-staging-ml-service:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 8000
        readinessProbe:
          httpGet: { path: /health, port: 8000 }
          initialDelaySeconds: 5
          periodSeconds: 10
        livenessProbe:
          httpGet: { path: /health, port: 8000 }
          initialDelaySeconds: 15
          periodSeconds: 20
        envFrom:
        - configMapRef:
            name: origin-shared-config
        env:
        - name: DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: origin-db-secrets
              key: database-url
---
apiVersion: v1
kind: Service
metadata:
  name: ml-service
spec:
  selector:
    app: ml-service
  ports:
  - port: 80
    targetPort: 8000

---
